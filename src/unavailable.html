<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>管理不可编辑时间</title>
  <script>
    (function () {
      var choice = "system";

      try {
        var stored = localStorage.getItem("gameScheduleTheme");
        if (stored === "light" || stored === "dark") choice = stored;
      } catch (error) {
        choice = "system";
      }

      var isDark = choice === "dark"
        || (choice === "system" && window.matchMedia
          && window.matchMedia("(prefers-color-scheme: dark)").matches);

      document.documentElement.dataset.theme = isDark ? "dark" : "light";
      document.documentElement.style.colorScheme = isDark ? "dark" : "light";
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #f5f6fa;
      --text: #1f2937;
      --header-bg: #24292f;
      --header-text: #ffffff;
      --card-bg: #ffffff;
      --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      --note-text: #64748b;
      --label-text: #475569;
      --input-bg: #ffffff;
      --input-border: #d1d5db;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --secondary: #64748b;
      --secondary-hover: #475569;
      --status-text: #2563eb;
      --border: #e5e7eb;
      --th-bg: #f8fafc;
      --tag-block-bg: #fee2e2;
      --tag-block-text: #991b1b;
      --tag-allow-bg: #dcfce7;
      --tag-allow-text: #166534;
      --section-title: #1e293b;
      --count-bg: #e2e8f0;
      --count-text: #475569;
      --history-border: #dbe2ea;
      --history-bg: #f8fafc;
      --summary-text: #334155;
      --marker-text: #64748b;
      --group-border: #e2e8f0;
      --group-bg: #ffffff;
      --empty-border: #cbd5e1;
      --empty-text: #94a3b8;
      --empty-bg: #f8fafc;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --page-bg: #0b1220;
      --text: #dbe3ee;
      --header-bg: #111c2f;
      --header-text: #e8eef7;
      --card-bg: #162033;
      --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      --note-text: #93a3b8;
      --label-text: #a2b2c7;
      --input-bg: #0f172a;
      --input-border: #33415a;
      --status-text: #7dd3fc;
      --border: #26334a;
      --th-bg: #1a2436;
      --tag-block-bg: #4a1f26;
      --tag-block-text: #fca5a5;
      --tag-allow-bg: #143528;
      --tag-allow-text: #86efac;
      --section-title: #e2e8f0;
      --count-bg: #223049;
      --count-text: #b3c1d6;
      --history-border: #26334a;
      --history-bg: #131c2b;
      --summary-text: #d3dcea;
      --marker-text: #93a3b8;
      --group-border: #26334a;
      --group-bg: #1a2436;
      --empty-border: #33415a;
      --empty-text: #7b8ba1;
      --empty-bg: #131c2b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: var(--page-bg);
      color: var(--text);
      transition: background-color 0.2s, color 0.2s;
    }
    header {
      padding: 20px;
      background: var(--header-bg);
      color: var(--header-text);
      text-align: center;
      transition: background-color 0.2s;
    }
    main {
      width: min(1100px, 94%);
      margin: 24px auto 50px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--card-shadow);
      transition: background-color 0.2s, box-shadow 0.2s;
    }
    h2 { margin-top: 0; }
    .note {
      color: var(--note-text);
      line-height: 1.7;
    }
    .auth-row,
    .form-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 150px;
      flex: 1;
    }
    label { font-size: 14px; color: var(--label-text); }
    input, select {
      padding: 9px 10px;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      font-size: 14px;
      background: var(--input-bg);
      color: var(--text);
      transition: background-color 0.2s, border-color 0.2s, color 0.2s;
    }
    button {
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: var(--accent-hover); }
    .danger { background: var(--danger); }
    .danger:hover { background: var(--danger-hover); }
    .secondary { background: var(--secondary); }
    .secondary:hover { background: var(--secondary-hover); }
    .status {
      margin-top: 12px;
      color: var(--status-text);
      min-height: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }
    th, td {
      padding: 10px;
      border: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }
    th { background: var(--th-bg); }
    .tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
    }
    .tag.block { background: var(--tag-block-bg); color: var(--tag-block-text); }
    .tag.allow { background: var(--tag-allow-bg); color: var(--tag-allow-text); }
    .hidden { display: none; }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 18px;
    }
    .theme-field {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      font-size: 14px;
      color: var(--label-text);
    }
    .theme-field select { padding: 8px 10px; }

    .override-section {
      margin-top: 18px;
    }
    .override-section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 12px;
      font-size: 17px;
      color: var(--section-title);
    }
    .rule-count {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--count-bg);
      color: var(--count-text);
      font-size: 12px;
      font-weight: normal;
      white-space: nowrap;
    }
    .history-rules-panel {
      margin-top: 18px;
      border: 1px solid var(--history-border);
      border-radius: 12px;
      background: var(--history-bg);
      overflow: hidden;
    }
    .history-rules-panel > summary,
    .override-week-group > summary {
      cursor: pointer;
      user-select: none;
      list-style: none;
    }
    .history-rules-panel > summary::-webkit-details-marker,
    .override-week-group > summary::-webkit-details-marker {
      display: none;
    }
    .history-rules-panel > summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      color: var(--summary-text);
      font-weight: bold;
    }
    .history-rules-panel > summary::before {
      content: "▶";
      margin-right: 8px;
      color: var(--marker-text);
      font-size: 12px;
      transition: transform .2s;
    }
    .history-rules-panel[open] > summary::before {
      transform: rotate(90deg);
    }
    .history-rules-panel[open] > summary {
      border-bottom: 1px solid var(--history-border);
    }
    #otherWeeksOverrideList {
      padding: 14px;
    }
    .override-week-group {
      margin-bottom: 12px;
      overflow: hidden;
      border: 1px solid var(--group-border);
      border-radius: 10px;
      background: var(--group-bg);
    }
    .override-week-group:last-child {
      margin-bottom: 0;
    }
    .override-week-group > summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      color: var(--summary-text);
      font-weight: bold;
    }
    .override-week-content {
      padding: 0 12px 12px;
      overflow-x: auto;
    }
    .override-empty {
      padding: 18px;
      border: 1px dashed var(--empty-border);
      border-radius: 10px;
      color: var(--empty-text);
      text-align: center;
      background: var(--empty-bg);
    }
    .override-table {
      margin-top: 0;
    }

    @media (max-width: 760px) {
      table { display: block; overflow-x: auto; }
      .field { min-width: 100%; }
      .theme-field { margin-left: 0; }
    }
  </style>
</head>
<body>
<header>
  <h1>⚙️ 管理不可编辑时间</h1>
</header>

<main>
  <div class="toolbar">
    <button class="secondary" id="backBtn">返回日程表</button>
    <button id="refreshBtn">刷新规则</button>
    <label class="theme-field">
      主题
      <select id="themeSelect">
        <option value="system">跟随系统</option>
        <option value="light">浅色</option>
        <option value="dark">深色</option>
      </select>
    </label>
  </div>

  <section class="card" id="authCard">
    <h2>管理员验证</h2>
    <p class="note">管理固定每周规则和指定日期调整需要管理员密码。密码仅保存在当前浏览器标签页的 sessionStorage 中。</p>
    <div class="auth-row">
      <div class="field">
        <label for="adminPasswordInput">管理员密码</label>
        <input id="adminPasswordInput" type="password" placeholder="请输入管理员密码" />
      </div>
      <button id="verifyBtn">验证并加载</button>
    </div>
    <div class="status" id="authStatus"></div>
  </section>

  <div id="managerContent" class="hidden">
    <section class="card">
      <h2>固定每周不可编辑规则</h2>
      <p class="note">固定规则会在每周重复生效。例如周一 09:00-12:00，原因填写“上班”。</p>
      <div class="form-grid">
        <div class="field">
          <label for="weeklyDay">星期</label>
          <select id="weeklyDay">
            <option value="0">周一</option><option value="1">周二</option><option value="2">周三</option>
            <option value="3">周四</option><option value="4">周五</option><option value="5">周六</option><option value="6">周日</option>
          </select>
        </div>
        <div class="field">
          <label for="weeklyStart">开始时间</label>
          <select id="weeklyStart"></select>
        </div>
        <div class="field">
          <label for="weeklyEnd">结束时间</label>
          <select id="weeklyEnd"></select>
        </div>
        <div class="field">
          <label for="weeklyReason">原因</label>
          <input id="weeklyReason" maxlength="50" placeholder="例如：上班" />
        </div>
        <button id="addWeeklyBtn">添加固定规则</button>
      </div>

      <table>
        <thead><tr><th>星期</th><th>时间</th><th>原因</th><th>操作</th></tr></thead>
        <tbody id="weeklyTableBody"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>指定日期调整</h2>
      <p class="note">
        指定日期调整优先于固定每周规则。<br>
        “临时开放”适合请假或放假；“临时禁止”适合加班、开会或其他临时安排。后添加且时间重叠的规则优先。
      </p>
      <div class="form-grid">
        <div class="field">
          <label for="overrideDate">日期</label>
          <input id="overrideDate" type="date" />
        </div>
        <div class="field">
          <label for="overrideType">调整类型</label>
          <select id="overrideType">
            <option value="allow">临时开放</option>
            <option value="block">临时禁止</option>
          </select>
        </div>
        <div class="field">
          <label for="overrideStart">开始时间</label>
          <select id="overrideStart"></select>
        </div>
        <div class="field">
          <label for="overrideEnd">结束时间</label>
          <select id="overrideEnd"></select>
        </div>
        <div class="field">
          <label for="overrideReason">原因</label>
          <input id="overrideReason" maxlength="50" placeholder="例如：请假、放假、加班" />
        </div>
        <button id="addOverrideBtn">添加日期调整</button>
      </div>

      <div class="override-section">
        <h3 class="override-section-title">
          <span>本周临时规则</span>
          <span class="rule-count" id="currentWeekRuleCount">0 条</span>
        </h3>

        <div id="currentWeekOverrideList"></div>
      </div>

      <details class="history-rules-panel" id="otherWeeksPanel">
        <summary>
          <span>查看其他周的临时规则</span>
          <span class="rule-count" id="otherWeeksRuleCount">0 条</span>
        </summary>

        <div id="otherWeeksOverrideList"></div>
      </details>
    </section>
  </div>
</main>

<script>
  const days = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];

  const adminPasswordInput = document.getElementById("adminPasswordInput");
  const verifyBtn = document.getElementById("verifyBtn");
  const authStatus = document.getElementById("authStatus");
  const managerContent = document.getElementById("managerContent");
  const refreshBtn = document.getElementById("refreshBtn");
  const themeSelect = document.getElementById("themeSelect");
  const systemThemeQuery = typeof window.matchMedia === "function"
    ? window.matchMedia("(prefers-color-scheme: dark)")
    : { matches: false };

  function getThemeChoice() {
    try {
      const stored = localStorage.getItem("gameScheduleTheme");
      return stored === "light" || stored === "dark" ? stored : "system";
    } catch (error) {
      return "system";
    }
  }

  function applyTheme(choice) {
    const isDark = choice === "dark" || (choice === "system" && systemThemeQuery.matches);
    document.documentElement.dataset.theme = isDark ? "dark" : "light";
    document.documentElement.style.colorScheme = isDark ? "dark" : "light";
    if (themeSelect.value !== choice) themeSelect.value = choice;
  }

  function saveThemeChoice(choice) {
    try {
      if (choice === "system") localStorage.removeItem("gameScheduleTheme");
      else localStorage.setItem("gameScheduleTheme", choice);
    } catch (error) {
      console.warn("保存主题设置失败", error);
    }
  }

  themeSelect.value = getThemeChoice();
  applyTheme(themeSelect.value);

  themeSelect.addEventListener("change", () => {
    saveThemeChoice(themeSelect.value);
    applyTheme(themeSelect.value);
  });

  const onSystemThemeChange = () => {
    if (getThemeChoice() === "system") applyTheme("system");
  };

  if (typeof systemThemeQuery.addEventListener === "function") {
    systemThemeQuery.addEventListener("change", onSystemThemeChange);
  } else if (typeof systemThemeQuery.addListener === "function") {
    systemThemeQuery.addListener(onSystemThemeChange);
  }

  const backBtn = document.getElementById("backBtn");

  const weeklyDay = document.getElementById("weeklyDay");
  const weeklyStart = document.getElementById("weeklyStart");
  const weeklyEnd = document.getElementById("weeklyEnd");
  const weeklyReason = document.getElementById("weeklyReason");
  const addWeeklyBtn = document.getElementById("addWeeklyBtn");
  const weeklyTableBody = document.getElementById("weeklyTableBody");

  const overrideDate = document.getElementById("overrideDate");
  const overrideType = document.getElementById("overrideType");
  const overrideStart = document.getElementById("overrideStart");
  const overrideEnd = document.getElementById("overrideEnd");
  const overrideReason = document.getElementById("overrideReason");
  const addOverrideBtn = document.getElementById("addOverrideBtn");
  const currentWeekOverrideList = document.getElementById("currentWeekOverrideList");
  const otherWeeksOverrideList = document.getElementById("otherWeeksOverrideList");
  const currentWeekRuleCount = document.getElementById("currentWeekRuleCount");
  const otherWeeksRuleCount = document.getElementById("otherWeeksRuleCount");
  const otherWeeksPanel = document.getElementById("otherWeeksPanel");

  fillHourSelect(weeklyStart, 0, 23, 9);
  fillHourSelect(weeklyEnd, 1, 24, 12);
  fillHourSelect(overrideStart, 0, 23, 9);
  fillHourSelect(overrideEnd, 1, 24, 18);
  overrideDate.value = formatDate(new Date());

  adminPasswordInput.value = sessionStorage.getItem("gameScheduleAdminPassword") || "";

  verifyBtn.addEventListener("click", loadRules);
  refreshBtn.addEventListener("click", loadRules);
  backBtn.addEventListener("click", () => window.location.href = "index.html");
  addWeeklyBtn.addEventListener("click", addWeeklyBlock);
  addOverrideBtn.addEventListener("click", addDateOverride);

  if (adminPasswordInput.value) loadRules();

  async function loadRules() {
    const adminPassword = getAdminPassword();
    if (!adminPassword) {
      authStatus.textContent = "请输入管理员密码。";
      adminPasswordInput.focus();
      return;
    }

    authStatus.textContent = "正在验证并加载规则...";

    try {
      const result = await postApi("listUnavailableAdmin", { adminPassword });
      sessionStorage.setItem("gameScheduleAdminPassword", adminPassword);
      renderWeeklyRules(result.weeklyBlocks || []);
      renderDateOverrides(result.dateOverrides || []);
      managerContent.classList.remove("hidden");
      authStatus.textContent = "管理员验证成功，规则已加载。";
    } catch (error) {
      managerContent.classList.add("hidden");
      authStatus.textContent = error.message;
    }
  }

  async function addWeeklyBlock() {
    try {
      await postApi("addWeeklyBlock", {
        adminPassword: getAdminPassword(),
        dayIndex: Number(weeklyDay.value),
        startHour: Number(weeklyStart.value),
        endHour: Number(weeklyEnd.value),
        reason: weeklyReason.value.trim()
      });
      weeklyReason.value = "";
      await loadRules();
    } catch (error) {
      alert(error.message);
    }
  }

  async function addDateOverride() {
    try {
      await postApi("addDateOverride", {
        adminPassword: getAdminPassword(),
        overrideDate: overrideDate.value,
        overrideType: overrideType.value,
        startHour: Number(overrideStart.value),
        endHour: Number(overrideEnd.value),
        reason: overrideReason.value.trim()
      });
      overrideReason.value = "";
      await loadRules();
    } catch (error) {
      alert(error.message);
    }
  }

  async function deleteWeeklyBlock(id) {
    if (!confirm("确定删除这条固定每周规则吗？")) return;
    try {
      await postApi("deleteWeeklyBlock", { adminPassword: getAdminPassword(), id });
      await loadRules();
    } catch (error) {
      alert(error.message);
    }
  }

  async function deleteDateOverride(id) {
    if (!confirm("确定删除这条指定日期调整吗？")) return;
    try {
      await postApi("deleteDateOverride", { adminPassword: getAdminPassword(), id });
      await loadRules();
    } catch (error) {
      alert(error.message);
    }
  }

  function renderWeeklyRules(items) {
    weeklyTableBody.innerHTML = "";
    if (items.length === 0) {
      weeklyTableBody.innerHTML = `<tr><td colspan="4">暂无固定每周规则</td></tr>`;
      return;
    }

    items.forEach(item => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${escapeHTML(days[Number(item.day_index)] || "未知")}</td>
        <td>${formatHour(item.start_hour)} - ${formatHour(item.end_hour)}</td>
        <td>${escapeHTML(item.reason)}</td>
        <td><button class="danger" data-id="${Number(item.id)}">删除</button></td>
      `;
      row.querySelector("button").addEventListener("click", () => deleteWeeklyBlock(Number(item.id)));
      weeklyTableBody.appendChild(row);
    });
  }

  function renderDateOverrides(items) {
    const rules = Array.isArray(items) ? [...items] : [];

    rules.sort((a, b) => {
      const dateCompare = String(a.override_date).localeCompare(String(b.override_date));
      if (dateCompare !== 0) return dateCompare;
      return Number(a.start_hour) - Number(b.start_hour);
    });

    const currentWeek = getCurrentWeekRange();
    const currentWeekRules = [];
    const otherWeekRules = [];

    rules.forEach(item => {
      const date = parseLocalDate(item.override_date);

      if (date >= currentWeek.start && date <= currentWeek.end) {
        currentWeekRules.push(item);
      } else {
        otherWeekRules.push(item);
      }
    });

    currentWeekRuleCount.textContent = `${currentWeekRules.length} 条`;
    otherWeeksRuleCount.textContent = `${otherWeekRules.length} 条`;

    renderCurrentWeekRules(currentWeekRules);
    renderOtherWeekRules(otherWeekRules);

    otherWeeksPanel.style.display = otherWeekRules.length > 0 ? "" : "none";
  }

  function renderCurrentWeekRules(items) {
    if (items.length === 0) {
      currentWeekOverrideList.innerHTML = `
        <div class="override-empty">本周暂无临时开放或临时禁止规则</div>
      `;
      return;
    }

    currentWeekOverrideList.innerHTML = createOverrideTable(items);
    bindOverrideDeleteButtons(currentWeekOverrideList);
  }

  function renderOtherWeekRules(items) {
    if (items.length === 0) {
      otherWeeksOverrideList.innerHTML = `
        <div class="override-empty">暂无其他周的临时规则</div>
      `;
      return;
    }

    const grouped = {};

    items.forEach(item => {
      const week = getWeekRangeForDate(item.override_date);
      const key = formatDate(week.start);

      if (!grouped[key]) {
        grouped[key] = {
          start: week.start,
          end: week.end,
          items: []
        };
      }

      grouped[key].items.push(item);
    });

    const groups = Object.values(grouped).sort((a, b) => {
      const now = new Date();
      const aDistance = Math.abs(a.start.getTime() - now.getTime());
      const bDistance = Math.abs(b.start.getTime() - now.getTime());
      return aDistance - bDistance;
    });

    otherWeeksOverrideList.innerHTML = groups.map(group => `
      <details class="override-week-group">
        <summary>
          <span>${escapeHTML(formatWeekTitle(group.start, group.end))}</span>
          <span class="rule-count">${group.items.length} 条</span>
        </summary>
        <div class="override-week-content">
          ${createOverrideTable(group.items)}
        </div>
      </details>
    `).join("");

    bindOverrideDeleteButtons(otherWeeksOverrideList);
  }

  function createOverrideTable(items) {
    const rows = items.map(item => {
      const isAllow = item.override_type === "allow";

      return `
        <tr>
          <td>${escapeHTML(item.override_date)}</td>
          <td><span class="tag ${isAllow ? "allow" : "block"}">${isAllow ? "临时开放" : "临时禁止"}</span></td>
          <td>${formatHour(item.start_hour)} - ${formatHour(item.end_hour)}</td>
          <td>${escapeHTML(item.reason)}</td>
          <td><button class="danger override-delete-btn" data-id="${Number(item.id)}">删除</button></td>
        </tr>
      `;
    }).join("");

    return `
      <table class="override-table">
        <thead>
          <tr><th>日期</th><th>类型</th><th>时间</th><th>原因</th><th>操作</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  function bindOverrideDeleteButtons(container) {
    container.querySelectorAll(".override-delete-btn").forEach(button => {
      button.addEventListener("click", () => {
        deleteDateOverride(Number(button.dataset.id));
      });
    });
  }

  function getCurrentWeekRange() {
    return getWeekRangeForDate(formatDate(new Date()));
  }

  function getWeekRangeForDate(dateValue) {
    const date = parseLocalDate(dateValue);
    const day = date.getDay();
    const distanceToMonday = day === 0 ? -6 : 1 - day;

    const start = new Date(date);
    start.setDate(date.getDate() + distanceToMonday);
    start.setHours(0, 0, 0, 0);

    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    end.setHours(23, 59, 59, 999);

    return { start, end };
  }

  function parseLocalDate(dateValue) {
    const parts = String(dateValue).split("-").map(Number);

    return new Date(
      parts[0],
      parts[1] - 1,
      parts[2],
      0,
      0,
      0,
      0
    );
  }

  function formatWeekTitle(start, end) {
    const sameYear = start.getFullYear() === end.getFullYear();

    if (sameYear) {
      return `${start.getFullYear()}年${start.getMonth() + 1}月${start.getDate()}日 至 ${end.getMonth() + 1}月${end.getDate()}日`;
    }

    return `${start.getFullYear()}年${start.getMonth() + 1}月${start.getDate()}日 至 ${end.getFullYear()}年${end.getMonth() + 1}月${end.getDate()}日`;
  }

  async function postApi(action, body) {
    const response = await fetch(`api.php?action=${encodeURIComponent(action)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    let result;
    try {
      result = await response.json();
    } catch {
      throw new Error("服务器返回了无效响应，请检查 PHP 日志。");
    }

    if (!response.ok || !result.success) {
      throw new Error(result.message || "操作失败");
    }

    return result;
  }

  function getAdminPassword() {
    return adminPasswordInput.value.trim();
  }

  function fillHourSelect(select, min, max, selectedValue) {
    for (let hour = min; hour <= max; hour++) {
      const option = document.createElement("option");
      option.value = hour;
      option.textContent = formatHour(hour);
      if (hour === selectedValue) option.selected = true;
      select.appendChild(option);
    }
  }

  function formatHour(hour) {
    return `${String(hour).padStart(2, "0")}:00`;
  }

  function formatDate(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    })[char]);
  }
</script>
</body>
</html>
